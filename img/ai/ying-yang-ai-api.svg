<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#0a0a1e"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    
    <!-- API side gradient (light/cyan) -->
    <radialGradient id="apiGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#00ffff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </radialGradient>
    
    <!-- AI side gradient (dark/purple) -->
    <radialGradient id="aiGradient" cx="70%" cy="70%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#6b46c1"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </radialGradient>
    
    <!-- Electric blue for connections -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0066ff"/>
    </linearGradient>
    
    <!-- Electric purple for connections -->
    <linearGradient id="electricPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    
    <!-- Outer ring gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner glow -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)"/>
  
  <!-- Outer glow ring -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGradient)" stroke-width="8" opacity="0.6" filter="url(#strongGlow)"/>
  
  <!-- Main Yin-Yang circle -->
  <g transform="translate(200, 200)">
    <!-- Outer border -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#ringGradient)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- API side (light) -->
    <path d="M0,-160 A160,160 0 0,1 0,160 A80,80 0 0,0 0,0 A80,80 0 0,1 0,-160" 
          fill="url(#apiGradient)" filter="url(#glow)"/>
    
    <!-- AI side (dark) -->
    <path d="M0,-160 A160,160 0 0,0 A80,80 0 0,1 0,0 A80,80 0 0,0 0,-160" 
          fill="url(#aiGradient)" filter="url(#glow)"/>
    
    <!-- Small circles (dots) -->
    <!-- API dot (dark on light side) -->
    <circle cx="0" cy="-80" r="30" fill="url(#aiGradient)" filter="url(#glow)"/>
    <!-- AI dot (light on dark side) -->
    <circle cx="0" cy="80" r="30" fill="url(#apiGradient)" filter="url(#glow)"/>
    
    <!-- API Network Symbol (top) -->
    <g transform="translate(0, -80)">
      <!-- Central API hub -->
      <circle cx="0" cy="0" r="12" fill="url(#electricPurple)" filter="url(#innerGlow)"/>
      <text x="0" y="4" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">API</text>
      
      <!-- Connection lines -->
      <g stroke="url(#electricPurple)" stroke-width="2" filter="url(#innerGlow)">
        <!-- 8 directions -->
        <line x1="0" y1="-12" x2="0" y2="-22"/>
        <line x1="8.5" y1="-8.5" x2="15.5" y2="-15.5"/>
        <line x1="12" y1="0" x2="22" y2="0"/>
        <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/>
        <line x1="0" y1="12" x2="0" y2="22"/>
        <line x1="-8.5" y1="8.5" x2="-15.5" y2="15.5"/>
        <line x1="-12" y1="0" x2="-22" y2="0"/>
        <line x1="-8.5" y1="-8.5" x2="-15.5" y2="-15.5"/>
      </g>
      
      <!-- Connection nodes -->
      <g fill="url(#electricPurple)" filter="url(#innerGlow)">
        <circle cx="0" cy="-22" r="3"/>
        <circle cx="15.5" cy="-15.5" r="3"/>
        <circle cx="22" cy="0" r="3"/>
        <circle cx="15.5" cy="15.5" r="3"/>
        <circle cx="0" cy="22" r="3"/>
        <circle cx="-15.5" cy="15.5" r="3"/>
        <circle cx="-22" cy="0" r="3"/>
        <circle cx="-15.5" cy="-15.5" r="3"/>
      </g>
    </g>
    
    <!-- AI Network Symbol (bottom) -->
    <g transform="translate(0, 80)">
      <!-- Central AI hub -->
      <circle cx="0" cy="0" r="12" fill="url(#electricBlue)" filter="url(#innerGlow)"/>
      <text x="0" y="4" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI</text>

      <!-- Connection lines -->
      <g stroke="url(#electricBlue)" stroke-width="2" filter="url(#innerGlow)">
        <!-- 8 directions -->
        <line x1="0" y1="-12" x2="0" y2="-22"/>
        <line x1="8.5" y1="-8.5" x2="15.5" y2="-15.5"/>
        <line x1="12" y1="0" x2="22" y2="0"/>
        <line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/>
        <line x1="0" y1="12" x2="0" y2="22"/>
        <line x1="-8.5" y1="8.5" x2="-15.5" y2="15.5"/>
        <line x1="-12" y1="0" x2="-22" y2="0"/>
        <line x1="-8.5" y1="-8.5" x2="-15.5" y2="-15.5"/>
      </g>
      
      <!-- Connection nodes -->
      <g fill="url(#electricBlue)" filter="url(#innerGlow)">
        <circle cx="0" cy="-22" r="3"/>
        <circle cx="15.5" cy="-15.5" r="3"/>
        <circle cx="22" cy="0" r="3"/>
        <circle cx="15.5" cy="15.5" r="3"/>
        <circle cx="0" cy="22" r="3"/>
        <circle cx="-15.5" cy="15.5" r="3"/>
        <circle cx="-22" cy="0" r="3"/>
        <circle cx="-15.5" cy="-15.5" r="3"/>
      </g>
    </g>
  </g>
  
  <!-- Floating particles for extra futuristic feel -->
  <g fill="url(#electricBlue)" opacity="0.6">
    <circle cx="50" cy="100" r="2" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="150" r="1.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="320" r="2.5" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="80" r="1.8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Rotating outer ring animation -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#ringGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="10,5">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 200 200" to="360 200 200" dur="20s" repeatCount="indefinite"/>
  </circle>
</svg>