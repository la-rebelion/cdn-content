<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients (same as original) -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1193b0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a7a94;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#da7756;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b85d42;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="lightBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1193b0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1193b0;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1193b0" stroke-width="0.5" opacity="0.1"/>
    </pattern>

    <!-- Arrowhead markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3, 0 6" fill="#1193b0"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0f0f0f"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  
  <!-- Title -->
  <text x="600" y="40" fill="#1193b0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">HAPI Ecosystem Overview</text>
  <text x="600" y="60" fill="#da7756" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">The Happiness Stack</text>
  
  <!-- Left Section - Design -->
  <g id="design-section">
    <rect x="20" y="100" width="240" height="400" rx="15" fill="url(#orangeGradient)" opacity="0.8"/>
    <text x="140" y="130" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Design</text>
    
    <!-- Local component -->
    <rect x="40" y="160" width="80" height="50" rx="10" fill="url(#blueGradient)" filter="url(#glow)"/>
    <text x="80" y="190" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Local</text>
    
    <!-- URL component -->
    <ellipse cx="180" cy="185" rx="50" ry="25" fill="url(#blueGradient)" filter="url(#glow)" stroke="#1193b0" stroke-width="2"/>
    <text x="180" y="190" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">URL</text>
    
    <!-- Swagger/OAS component -->
    <rect x="50" y="250" width="160" height="60" rx="15" fill="url(#blueGradient)" filter="url(#glow)"/>
    <text x="130" y="275" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Swagger</text>
    <text x="130" y="295" fill="white" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">(OAS v3)</text>
    
    <!-- Connection lines with animations -->
    <path d="M 120 185 Q 130 200 130 250" stroke="#1193b0" stroke-width="2" fill="none" opacity="0.7" marker-end="url(#arrowhead)">
      <animate attributeName="stroke-dasharray" values="0,5;10,0;0,5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 155 200 Q 145 225 130 250" stroke="#1193b0" stroke-width="2" fill="none" opacity="0.7" marker-end="url(#arrowhead)">
      <animate attributeName="stroke-dasharray" values="0,5;10,0;0,5" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Center Section - Business Logic -->
  <g id="business-logic">
    <rect x="300" y="100" width="300" height="500" rx="15" fill="url(#lightBlueGradient)" stroke="#1193b0" stroke-width="2"/>
    <text x="450" y="130" fill="#1193b0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Business Logic</text>
    
    <!-- Local and Cloud options -->
    <rect x="320" y="160" width="80" height="40" rx="10" fill="url(#darkGradient)" stroke="#1193b0" stroke-width="1"/>
    <text x="360" y="185" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Local</text>
    
    <ellipse cx="480" cy="180" rx="50" ry="20" fill="url(#darkGradient)" stroke="#1193b0" stroke-width="1"/>
    <image href="https://cdn-icons-png.flaticon.com/512/8099/8099231.png" x="465" y="165" width="30" height="30"/>
    <text x="520" y="185" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Cloud</text>
    
    <!-- Design label -->
    <text x="320" y="240" fill="#da7756" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Design</text>
    
    <!-- HAPI Server (central component) -->
    <rect x="350" y="250" width="200" height="80" rx="15" fill="url(#blueGradient)" filter="url(#glow)"/>
    <text x="450" y="280" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">😁 HAPI</text>
    <text x="450" y="305" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Server</text>
    <text x="330" y="285" fill="#1193b0" font-family="Arial, sans-serif" font-size="10">REST</text>
    <text x="330" y="305" fill="#1193b0" font-family="Arial, sans-serif" font-size="10">MCP</text>
    
    <!-- chatMCP component -->
    <rect x="340" y="380" width="220" height="100" rx="15" fill="url(#blueGradient)" filter="url(#glow)"/>
    <image href="https://raw.githubusercontent.com/modelcontextprotocol/specification/main/logo.svg" x="360" y="400" width="60" height="60"/>
    <text x="470" y="430" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">chatMCP</text>
    <text x="470" y="450" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Multi-Agent Chat Interface</text>
    
    <!-- Connection arrows -->
    <path d="M 450 330 L 450 380" stroke="#1193b0" stroke-width="3" fill="none" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Right Section - LLMs -->
  <g id="llms-section">
    <rect x="640" y="100" width="280" height="400" rx="15" fill="url(#blueGradient)" opacity="0.8"/>
    <text x="780" y="130" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">LLMs</text>
    
    <!-- AI Icons and providers -->
    <rect x="660" y="160" width="240" height="80" rx="10" fill="url(#darkGradient)" stroke="#1193b0" stroke-width="1"/>
    
    <!-- OpenAI -->
    <image href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/ChatGPT_logo.svg/512px-ChatGPT_logo.svg.png" x="670" y="170" width="30" height="30"/>
    <text x="685" y="220" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">GPT</text>
    
    <!-- Anthropic Claude -->
    <rect x="710" y="170" width="30" height="30" rx="15" fill="#da7756"/>
    <text x="725" y="190" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A</text>
    <text x="725" y="220" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Claude</text>
    
    <!-- Google Gemini -->
    <circle cx="765" cy="185" r="15" fill="#4285f4"/>
    <text x="765" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">G</text>
    <text x="765" y="220" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Gemini</text>
    
    <!-- Local AI -->
    <rect x="810" y="170" width="30" height="30" rx="5" fill="url(#orangeGradient)"/>
    <text x="825" y="190" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🏠</text>
    <text x="825" y="220" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Local</text>
    
    <!-- Happy face emoji -->
    <text x="780" y="290" fill="#ffeb3b" font-family="Arial, sans-serif" font-size="60" text-anchor="middle">😊</text>
    <text x="780" y="320" fill="white" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">AI-Powered Happiness</text>
  </g>
  
  <!-- Connection arrows between sections -->
  <g id="main-connections">
    <!-- Design to Business Logic -->
    <path d="M 260 250 Q 280 250 300 280" stroke="#1193b0" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0,10;15,5;0,10" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <!-- Business Logic to LLMs -->
    <path d="M 560 430 Q 600 430 640 290" stroke="#1193b0" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0,10;15,5;0,10" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Bottom section - runMCP branding -->
  <g id="bottom-branding">
    <text x="600" y="680" fill="#1193b0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">run</text>
    <text x="650" y="680" fill="#da7756" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle">MCP</text>
    <text x="600" y="700" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Powering the HAPI Ecosystem</text>
    
    <!-- Mascot character -->
    <g transform="translate(1000, 650)">
      <!-- Simple mascot representation -->
      <circle cx="0" cy="-20" r="25" fill="#1193b0"/>
      <circle cx="-8" cy="-25" r="3" fill="white"/>
      <circle cx="8" cy="-25" r="3" fill="white"/>
      <path d="M -8 -15 Q 0 -10 8 -15" stroke="white" stroke-width="2" fill="none"/>
      <rect x="-15" y="0" width="30" height="40" rx="5" fill="#da7756"/>
      <rect x="-20" y="10" width="40" height="3" rx="1" fill="#b85d42"/>
      <!-- Arms -->
      <ellipse cx="-25" cy="15" rx="8" ry="15" fill="#da7756"/>
      <ellipse cx="25" cy="15" rx="8" ry="15" fill="#da7756"/>
      <!-- Legs -->
      <rect x="-10" y="40" width="8" height="20" rx="4" fill="#1193b0"/>
      <rect x="2" y="40" width="8" height="20" rx="4" fill="#1193b0"/>
      <!-- Hand wave animation -->
      <g transform-origin="25 15">
        <animateTransform attributeName="transform" type="rotate" values="0;15;-15;0" dur="2s" repeatCount="indefinite"/>
        <ellipse cx="25" cy="15" rx="8" ry="15" fill="#da7756"/>
      </g>
    </g>
  </g>
  
  <!-- Floating particles animation -->
  <g id="particles">
    <circle r="2" fill="#1193b0" opacity="0.6">
      <animate attributeName="cx" values="50;1150;50" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="400;200;400" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#da7756" opacity="0.4">
      <animate attributeName="cx" values="100;1100;100" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="300;500;300" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
